name: Build openconnect wrapper + publish Maven packages

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  build-native-wrapper-linux:
    name: Build native openconnect-wrapper (.so) on Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential autoconf automake libtool pkg-config \
            libssl-dev libxml2-dev liblz4-dev libproxy-dev gettext \
            openjdk-17-jdk ant

      - name: Configure and build with Java support
        run: |
          if [ -x ./autogen.sh ]; then
            ./autogen.sh
          fi
          ./configure --with-java --with-vpnc-script=/etc/vpnc/vpnc-script
          make

      - name: Build Java JNI wrapper (Ant)
        run: |
          cd java
          ant

      - name: Locate Java wrapper JAR (built by Ant)
        id: find_java_jar
        run: |
          echo "Searching for wrapper jar in ./java ..."
          JAR_PATH=$(find java -type f -name '*.jar' | grep -E '(openconnect|wrapper|libopenconnect)' | head -n 1 || true)
          if [ -z "$JAR_PATH" ]; then
            echo "No wrapper jar found via name filter; fallback to first jar under ./java"
            JAR_PATH=$(find java -type f -name '*.jar' | head -n 1 || true)
          fi

          if [ -z "$JAR_PATH" ]; then
            echo "No .jar found under ./java - Ant build did not produce a jar?"
            exit 1
          fi

          echo "Found Java jar at $JAR_PATH"
          echo "jar_path=$JAR_PATH" >> "$GITHUB_OUTPUT"

      - name: Prepare Java wrapper artifact (openconnect-wrapper-java)
        id: package_java
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          OUT="openconnect-wrapper-java-${VERSION}.jar"
          cp "${{ steps.find_java_jar.outputs.jar_path }}" "$OUT"
          echo "java_jar=$OUT" >> "$GITHUB_OUTPUT"

      - name: Upload Java wrapper jar as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: openconnect-wrapper-java
          path: ${{ steps.package_java.outputs.java_jar }}

      - name: Locate native wrapper library (.so)
        id: findlib_so
        run: |
          echo 'Searching for *openconnect* libraries in workspace (Linux)...'
          find . -maxdepth 8 -type f -name '*openconnect*' -print || true

          WRAPPER_PATH=$(find . -maxdepth 8 -type f -name 'libopenconnect-wrapper.so*' | head -n 1)
          if [ -z "$WRAPPER_PATH" ]; then
            echo 'libopenconnect-wrapper.so* not found'
            exit 1
          fi

          echo "Found wrapper at $WRAPPER_PATH"
          echo "wrapper_path=$WRAPPER_PATH" >> "$GITHUB_OUTPUT"

          # Optional: also bundle libopenconnect itself if it was built as shared lib
          LIBOC_PATH=$(find . -maxdepth 8 -type f -name 'libopenconnect.so*' | head -n 1 || true)
          if [ -n "$LIBOC_PATH" ]; then
            echo "Found libopenconnect at $LIBOC_PATH"
            echo "libopenconnect_path=$LIBOC_PATH" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Maven jar (linux-x86_64)
        id: package_linux
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          CLASSIFIER="linux-x86_64"

          mkdir -p dist/natives/${CLASSIFIER}
          cp "${{ steps.findlib_so.outputs.wrapper_path }}" "dist/natives/${CLASSIFIER}/libopenconnect-wrapper.so"

          if [ -n "${{ steps.findlib_so.outputs.libopenconnect_path }}" ]; then
            cp "${{ steps.findlib_so.outputs.libopenconnect_path }}" "dist/natives/${CLASSIFIER}/libopenconnect.so"
          fi

          jar cf "openconnect-wrapper-native-${VERSION}-${CLASSIFIER}.jar" -C dist .
          echo "jar_path=openconnect-wrapper-native-${VERSION}-${CLASSIFIER}.jar" >> "$GITHUB_OUTPUT"

      - name: Upload Maven jar as workflow artifact (linux)
        uses: actions/upload-artifact@v4
        with:
          name: openconnect-wrapper-native-linux-x86_64
          path: ${{ steps.package_linux.outputs.jar_path }}

      - name: Upload native library (.so) as release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.findlib_so.outputs.wrapper_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-native-wrapper-windows:
    name: Build native openconnect-wrapper (DLL) on Windows
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >-
            base-devel
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-binutils
            mingw-w64-x86_64-pkg-config
            autoconf
            automake
            libtool
            gettext
            mingw-w64-x86_64-libxml2
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-zlib
            jq
          msystem: MINGW64

      - name: Configure and build with Java support (MSYS2)
        shell: msys2 {0}
        run: |
          # Determine MSYS2-style JAVA_HOME and configure JNI includes
          JAVA_HOME_MSYS=$(cygpath -u "$JAVA_HOME")
          echo "JAVA_HOME_MSYS = $JAVA_HOME_MSYS"
          export JAVA_HOME="$JAVA_HOME_MSYS"
          export CPPFLAGS="-I$JAVA_HOME_MSYS/include -I$JAVA_HOME_MSYS/include/win32 -include winsock2.h"

          # Provide getuid() stub for Windows so JNI code compiles
          cat > getuid_stub.h << 'EOF'
          #ifndef GETUID_STUB_H
          #define GETUID_STUB_H
          /* Provide dummy getuid() on Windows for JNI build */
          static inline int getuid(void) { return 0; }
          #endif
          EOF

          # Force-include the stub header in all compilations
          export CPPFLAGS="$CPPFLAGS -include $PWD/getuid_stub.h"

          # Ensure vpnc-script is available inside MSYS2
          mkdir -p /etc/vpnc
          cp ./ci/vpnc-script /etc/vpnc/vpnc-script
          # Normalize line endings in vpnc-script (avoid CRLF issues)
          sed -i 's/\r$//' /etc/vpnc/vpnc-script
          chmod +x /etc/vpnc/vpnc-script

          # Fix potential CRLF issues introduced by Windows checkout before running autogen.sh
          if [ -f configure.ac ]; then
            sed -i 's/\r$//' configure.ac
          fi

          if [ -x ./autogen.sh ]; then
            ./autogen.sh
          fi

          # Work around Autoconf 2.72 undeclared builtins check on MinGW and use vpnc-script
          ac_cv_c_undeclared_builtin_options=none ./configure --with-java --with-vpnc-script=/etc/vpnc/vpnc-script || (test -f config.log && cat config.log; exit 1)

          # Build without treating warnings as errors on Windows, and add -no-undefined only for linking
          make LDFLAGS='-no-undefined' AM_CFLAGS='-Wall -Wextra -Wno-missing-field-initializers -Wno-sign-compare -Wno-unused-parameter -Wformat-nonliteral -Wformat-security -Winit-self -Wmissing-declarations -Wmissing-include-dirs -Wnested-externs -Wparentheses -Wpointer-arith -Wunused-function -Wwrite-strings'

      - name: Locate native wrapper library (DLL) - PowerShell
        id: findlib_dll
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Recurse -File -Filter "*openconnect-wrapper*.dll" | Select-Object -First 1
          if (-not $dll) {
            Write-Error "No *openconnect-wrapper*.dll found in workspace"
            exit 1
          }

          Write-Host "Found wrapper DLL at $($dll.FullName)"
          "dll_path=$($dll.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Collect runtime DLL dependencies (wrapper + libopenconnect transitive)
        shell: msys2 {0}
        run: |
          set -euo pipefail

          echo "=== Collect runtime DLL dependencies (transitive) ==="

          WRAPPER_WIN='${{ steps.findlib_dll.outputs.dll_path }}'
          if [ -z "$WRAPPER_WIN" ]; then
            echo "Wrapper DLL path output is empty"
            exit 1
          fi

          WRAPPER="$(cygpath -u "$WRAPPER_WIN")"
          if [ ! -f "$WRAPPER" ]; then
            echo "Wrapper DLL does not exist at MSYS path: $WRAPPER"
            exit 1
          fi

          if ! command -v objdump >/dev/null 2>&1; then
            echo "objdump not found. Ensure mingw-w64-x86_64-binutils is installed."
            exit 1
          fi

          OUTFILE="$(cygpath -u "$GITHUB_WORKSPACE")/deps_winpaths.txt"
          : > "$OUTFILE"

          is_system_dll() {
            case "$1" in
              KERNEL32.dll|USER32.dll|GDI32.dll|ADVAPI32.dll|SHELL32.dll|OLE32.dll|OLEAUT32.dll|WS2_32.dll|CRYPT32.dll|IPHLAPI.dll|COMDLG32.dll|COMCTL32.dll|WINMM.dll|VERSION.dll|SHLWAPI.dll|MSVCRT.dll|ntdll.dll|bcrypt.dll|secur32.dll)
                return 0 ;;
              *) return 1 ;;
            esac
          }

          resolve_and_write() {
            local name="$1"
            [ -z "$name" ] && return 0
            is_system_dll "$name" && return 0

            if [ -f "/mingw64/bin/$name" ]; then
              cygpath -w "/mingw64/bin/$name" >> "$OUTFILE"
              return 0
            fi

            local wrapper_dir
            wrapper_dir="$(dirname "$WRAPPER")"
            if [ -f "$wrapper_dir/$name" ]; then
              cygpath -w "$wrapper_dir/$name" >> "$OUTFILE"
              return 0
            fi

            local found
            found="$(find . -maxdepth 12 -type f -iname "$name" | head -n 1 || true)"
            if [ -n "$found" ] && [ -f "$found" ]; then
              cygpath -w "$found" >> "$OUTFILE"
              return 0
            fi

            echo "WARN: Could not resolve dependency: $name"
            return 0
          }

          collect_imports() {
            local file="$1"
            echo "--- Imports for: $file"
            objdump -p "$file" | awk '/DLL Name/ {print $3}' | while IFS= read -r name; do
              resolve_and_write "$name"
            done
          }

          # 1) Direct imports of wrapper
          collect_imports "$WRAPPER"

          # 2) Find libopenconnect-*.dll and include it + its imports
          LIBOC="$(find . -maxdepth 12 -type f -iname 'libopenconnect-*.dll' | head -n 1 || true)"
          if [ -n "$LIBOC" ] && [ -f "$LIBOC" ]; then
            echo "Found libopenconnect: $LIBOC"
            cygpath -w "$LIBOC" >> "$OUTFILE"
            collect_imports "$LIBOC"
          else
            echo "WARN: libopenconnect-*.dll not found in tree; will rely on MinGW bin if available"
          fi

          # 3) Always include common MinGW runtime DLLs
          for p in /mingw64/bin/libgcc_s_seh-1.dll /mingw64/bin/libstdc++-6.dll /mingw64/bin/libwinpthread-1.dll; do
            if [ -f "$p" ]; then
              cygpath -w "$p" >> "$OUTFILE"
            fi
          done

          # 4) Deduplicate
          sort -u -o "$OUTFILE" "$OUTFILE" || true

          echo "=== deps_winpaths.txt ==="
          cat "$OUTFILE" || true

      - name: Create Maven jar (windows-x86_64) incl. dependencies
        id: package_windows
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".Substring(1) # remove leading 'v'
          $classifier = "windows-x86_64"

          $distDir = "dist\natives\$classifier"
          New-Item -ItemType Directory -Force -Path $distDir | Out-Null

          Copy-Item "${{ steps.findlib_dll.outputs.dll_path }}" "$distDir\libopenconnect-wrapper.dll" -Force

          $depsFile = Join-Path $env:GITHUB_WORKSPACE "deps_winpaths.txt"
          if (Test-Path $depsFile) {
            Get-Content $depsFile | ForEach-Object {
              $p = $_.Trim()
              if ($p.Length -eq 0) { return }
              if (-not (Test-Path $p)) { return }

              $name = Split-Path $p -Leaf
              if ($name -ieq "libopenconnect-wrapper.dll") { return }

              Copy-Item $p (Join-Path $distDir $name) -Force
            }
          } else {
            Write-Host "deps_winpaths.txt not found; packaging wrapper DLL only"
          }

          $jarName = "openconnect-wrapper-native-$version-$classifier.jar"
          if (Test-Path $jarName) { Remove-Item $jarName -Force }

          Compress-Archive -Path "dist\*" -DestinationPath $jarName -Force
          "jar_path=$jarName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload Maven jar as workflow artifact (windows)
        uses: actions/upload-artifact@v4
        with:
          name: openconnect-wrapper-native-windows-x86_64
          path: ${{ steps.package_windows.outputs.jar_path }}

      - name: Upload native library (DLL) as release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.findlib_dll.outputs.dll_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-maven:
    name: Publish Maven packages to GitHub Packages
    runs-on: ubuntu-latest
    needs:
      - build-native-wrapper-linux
      - build-native-wrapper-windows
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download Java wrapper jar artifact
        uses: actions/download-artifact@v4
        with:
          name: openconnect-wrapper-java
          path: artifacts

      - name: Download linux native jar artifact
        uses: actions/download-artifact@v4
        with:
          name: openconnect-wrapper-native-linux-x86_64
          path: artifacts

      - name: Download windows native jar artifact
        uses: actions/download-artifact@v4
        with:
          name: openconnect-wrapper-native-windows-x86_64
          path: artifacts

      - name: Set up Java for Maven publish
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Publish Java + native artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          VERSION="${GITHUB_REF_NAME#v}"
          GROUP_ID="com.github.miguel0888"
          REPO_URL="https://maven.pkg.github.com/${GITHUB_REPOSITORY}"

          JAVA_JAR=$(ls artifacts/openconnect-wrapper-java-${VERSION}.jar 2>/dev/null || true)
          if [ -z "$JAVA_JAR" ]; then
            JAVA_JAR=$(ls artifacts/*wrapper-java*${VERSION}*.jar | head -n 1 || true)
          fi
          if [ -z "$JAVA_JAR" ]; then
            echo "Java wrapper jar not found in artifacts/"
            ls -la artifacts || true
            exit 1
          fi

          LINUX_JAR=$(ls artifacts/*linux-x86_64*.jar | head -n 1 || true)
          WINDOWS_JAR=$(ls artifacts/*windows-x86_64*.jar | head -n 1 || true)

          if [ -z "$LINUX_JAR" ] || [ -z "$WINDOWS_JAR" ]; then
            echo "Native jars not found in artifacts/"
            ls -la artifacts || true
            exit 1
          fi

          # 1) Publish Java bindings (creates its own POM)
          mvn -B deploy:deploy-file \
            -Durl="${REPO_URL}" \
            -DrepositoryId=github \
            -DgroupId="${GROUP_ID}" \
            -DartifactId="openconnect-wrapper-java" \
            -Dversion="${VERSION}" \
            -Dpackaging=jar \
            -Dfile="${JAVA_JAR}" \
            -DgeneratePom=true

          # 2) Publish native LINUX jar (IMPORTANT: generate the POM here!)
          # This creates openconnect-wrapper-native-${VERSION}.pom which Gradle needs.
          mvn -B deploy:deploy-file \
            -Durl="${REPO_URL}" \
            -DrepositoryId=github \
            -DgroupId="${GROUP_ID}" \
            -DartifactId="openconnect-wrapper-native" \
            -Dversion="${VERSION}" \
            -Dpackaging=jar \
            -Dclassifier=linux-x86_64 \
            -Dfile="${LINUX_JAR}" \
            -DgeneratePom=true

          # 3) Publish native WINDOWS jar (no POM again)
          mvn -B deploy:deploy-file \
            -Durl="${REPO_URL}" \
            -DrepositoryId=github \
            -DgroupId="${GROUP_ID}" \
            -DartifactId="openconnect-wrapper-native" \
            -Dversion="${VERSION}" \
            -Dpackaging=jar \
            -Dclassifier=windows-x86_64 \
            -Dfile="${WINDOWS_JAR}" \
            -DgeneratePom=false
